<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BizWiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0440">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06022a;color:#fff;
    font-family:"Pirata One","Luminari","Papyrus",fantasy,serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;filter:saturate(1.55) contrast(1.16)}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 42%,rgba(10,0,70,.5) 82%,rgba(3,0,28,.92) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;background:#9aa8ff;opacity:0;transition:opacity .5s}
  #touch{position:fixed;inset:0;touch-action:none}
  .ol{text-shadow:0 0 8px #3a4bff,0 0 2px #000,0 2px 0 #000}
  #hud{position:fixed;left:0;right:0;top:0;pointer-events:none;display:none;
    padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px);font-size:22px}
  #hudrow{display:flex;align-items:center;gap:10px}
  #lvl{white-space:nowrap;color:#cfd4ff}
  #stars{color:#ffd84a;white-space:nowrap}
  #bar{flex:1;height:10px;border-radius:6px;background:rgba(10,5,60,.7);border:1px solid #6f7bff;position:relative;box-shadow:0 0 10px #2b35ff}
  #barfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:linear-gradient(90deg,#5a6bff,#ffb030)}
  #barend{position:absolute;right:-7px;top:-10px;font-size:20px}
  .rb{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1px solid #6f7bff;background:rgba(10,5,60,.6);
    color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 10px rgba(58,69,255,.6)}
  #toast{position:fixed;left:0;right:0;top:21%;text-align:center;font-size:32px;pointer-events:none;opacity:0;transition:opacity .4s;padding:0 20px;
    text-shadow:0 0 14px #4f5cff,0 0 30px #2a2aff,0 2px 0 #000}
  #jump{position:fixed;right:calc(env(safe-area-inset-right) + 22px);bottom:calc(env(safe-area-inset-bottom) + 34px);
    width:92px;height:92px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:24px;letter-spacing:1px;
    background:radial-gradient(circle at 35% 30%,rgba(140,150,255,.75),rgba(40,30,200,.55) 60%,rgba(10,5,80,.6));
    border:2px solid #aab2ff;box-shadow:0 0 22px #3a45ff,inset 0 0 14px rgba(255,255,255,.35);touch-action:none}
  #jump.on{transform:scale(.92);box-shadow:0 0 34px #8f98ff,inset 0 0 20px rgba(255,255,255,.6)}
  #stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;pointer-events:none;display:none;
    border:2px solid rgba(170,178,255,.7);background:rgba(20,10,120,.25);box-shadow:0 0 18px rgba(58,69,255,.7)}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#cfd4ff,#4a55ff 65%,#1a1490)}
  #hint{position:fixed;left:calc(env(safe-area-inset-left) + 26px);bottom:calc(env(safe-area-inset-bottom) + 60px);font-size:18px;opacity:.8;pointer-events:none;display:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 16px);box-sizing:border-box;
    background:radial-gradient(ellipse at 50% 40%,rgba(30,20,190,.2),rgba(5,0,45,.8))}
  h1{font-size:clamp(54px,16vw,116px);margin:0;line-height:.9;font-weight:400;letter-spacing:2px;
    background:linear-gradient(180deg,#fff 10%,#aab6ff 45%,#4a3cff 70%,#ff9a2a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px #3a45ff) drop-shadow(0 4px 0 #0a0440)}
  .sub{font-size:22px;margin:14px 0 6px;color:#cfd4ff}
  .small{font-size:17px;color:#9aa4ff;max-width:340px;line-height:1.3}
  .btn{margin-top:18px;font:inherit;font-size:30px;color:#1a0a00;padding:10px 44px;border-radius:40px;border:2px solid #fff3c0;
    background:linear-gradient(180deg,#ffe27a,#ff9a1f 60%,#d85a00);box-shadow:0 0 30px #ff9a1f,0 0 70px rgba(255,120,0,.5);touch-action:manipulation}
  #grid{display:grid;grid-template-columns:repeat(8,36px);gap:6px;margin-top:18px}
  #grid button{font:inherit;font-size:18px;height:36px;border-radius:9px;border:1px solid #aab2ff;color:#fff;padding:0;
    background:linear-gradient(180deg,#5a66ff,#2418b0);box-shadow:0 0 10px rgba(58,69,255,.8);touch-action:manipulation}
  #grid button[disabled]{background:rgba(10,5,60,.55);box-shadow:none;border-color:rgba(120,130,255,.3);color:rgba(170,178,255,.4)}
  @media (max-height:700px){#title .small{display:none}}
  #clear{display:none}
  #err{position:fixed;left:10px;right:10px;bottom:10px;color:#ffb0b0;font:12px monospace;pointer-events:none;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="touch"></div>
<div id="hud"><div id="hudrow">
  <div id="lvl" class="ol">1/40</div>
  <div id="stars" class="ol">✦ 0/0</div>
  <div id="bar"><div id="barfill"></div><div id="barend">🏰</div></div>
  <div id="menu" class="rb">☰</div>
  <div id="mute" class="rb">♪</div>
</div></div>
<div id="toast"></div>
<div id="hint" class="ol">drag here to walk</div>
<div id="stick"><div id="knob"></div></div>
<div id="jump" class="ol">JUMP</div>

<div id="title" class="screen">
  <h1>BizWiz</h1>
  <div class="sub ol">Forty trials. Reach each tower gate.</div>
  <div class="small">Left thumb walks · right thumb looks · JUMP to leap. Do not fall into the moonwater.<br>Keyboard: WASD + mouse + space.</div>
  <button id="start" class="btn">Enter</button>
  <div id="grid"></div>
</div>
<div id="clear" class="screen">
  <h1 id="cleartitle" style="font-size:clamp(44px,13vw,96px)">The gate opens</h1>
  <div class="sub ol" id="clearstats"></div>
  <div class="small" id="clearbest"></div>
  <button id="next" class="btn">Onward</button>
</div>
<div id="err"></div>

<script src="three.min.js"></script>
<script>
"use strict";
window.addEventListener('error',e=>{document.getElementById('err').textContent+=e.message+'\n'});
const $=id=>document.getElementById(id);
const TAU=Math.PI*2, lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const rr=(a,b)=>a+(b-a)*rnd();
let dseed=11; const drnd=()=>{dseed=(dseed*48271)%2147483647;return dseed/2147483647};
const dr=(a,b)=>a+(b-a)*drnd();

/* ---------- procedural textures ---------- */
const h2=(x,y,s=0)=>{const n=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453;return n-Math.floor(n)};
function vnoise(x,y,per,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi;
  const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),m=a=>((a%per)+per)%per;
  const a=h2(m(xi),m(yi),s),b=h2(m(xi+1),m(yi),s),c=h2(m(xi),m(yi+1),s),d=h2(m(xi+1),m(yi+1),s);
  return lerp(lerp(a,b,u),lerp(c,d,u),v)}
function fbm(u,v,per=4,s=0,oct=4){let t=0,a=.5,p=per;for(let o=0;o<oct;o++){t+=a*vnoise(u*p,v*p,p,s+o);a*=.5;p*=2}return t/.9375}
function mkTex(size,fn,rx=1,ry=1){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  const im=g.createImageData(size,size),d=im.data;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const p=fn(x/size,y/size),i=(y*size+x)*4;
    d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=p.length>3?p[3]:255}
  g.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t}
function drawTex(w,h,fn,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);
  if(rx){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry||rx)}return t}
function voro(u,v,N,s){let x=u*N,y=v*N,xi=Math.floor(x),yi=Math.floor(y),d1=9,d2=9,id=0;
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const cx=xi+i,cy=yi+j,mx=((cx%N)+N)%N,my=((cy%N)+N)%N;
    const px=cx+.2+.6*h2(mx,my,s),py=cy+.2+.6*h2(mx,my,s+9),d=Math.hypot(px-x,py-y);
    if(d<d1){d2=d1;d1=d;id=h2(mx,my,s+3)}else if(d<d2)d2=d}
  return [d1,d2,id]}
const star4=(g,cx,cy,R,r=R*.12)=>{g.beginPath();for(let i=0;i<8;i++){const a=i*TAU/8,q=i%2?r:R;g.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q)}g.fill()};
const star5=(g,cx,cy,R)=>{g.beginPath();for(let i=0;i<10;i++){const a=i*TAU/10-Math.PI/2,q=i%2?R*.45:R;g.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q)}g.fill()};

const T={};
T.grass=mkTex(128,(u,v)=>{const n=fbm(u,v,8,1),m=fbm(u,v,16,5,3),sp=h2(u*128,v*128,2);
  let r=4+14*n,g=22+90*n*m*1.6,b=10+26*(1-n);
  if(sp>.96){g+=120;r+=40;b+=10} if(m>.7){b+=50;g*=.75}
  return [r,g,b]},5,5);
T.cobble=mkTex(128,(u,v)=>{const [d1,d2,id]=voro(u,v,6,4),e=d2-d1,n=fbm(u,v,16,8,3);
  if(e<.09)return [6,3,34]; const s=clamp((e-.09)*3.4,0,1)*(.5+.65*id)*(.65+.65*n);
  return [34+100*s,32+92*s,112+143*s]});
T.brick=mkTex(128,(u,v)=>{const row=Math.floor(v*8),x=(u*4+(row%2)*.5)%1,y=(v*8)%1,n=fbm(u,v,16,11,3),id=h2(Math.floor(u*4+(row%2)*.5),row,6);
  if(x<.06||y<.12)return [5,3,26]; const s=(.45+.55*id)*(.55+.75*n);
  return [30+50*s,30+48*s,84+130*s]},2,2);
T.rock=mkTex(64,(u,v)=>{const n=fbm(u,v,6,21),m=fbm(u,v,12,23,3);
  return [40+110*n*m*1.5,18+46*n,36+110*(1-n)*m]},2,2);
T.bark=mkTex(64,(u,v)=>{const n=fbm(u*1,v*.25,8,31),m=fbm(u,v,8,33,3);const k=Math.abs(n-.5)*2;
  let r=14+44*k,g=10+28*k,b=44+170*k*m; if(m>.6){g+=85;b*=.5} return [r,g,b]},2,3);
T.shingle=mkTex(64,(u,v)=>{const row=Math.floor(v*8),x=(u*8+(row%2)*.5)%1,y=(v*8)%1,m=fbm(u,v,8,41,3);
  const sc=y-.5*Math.abs(Math.sin(x*Math.PI)); if(sc<-.3||x<.06)return [6,5,28];
  let s=.45+.55*y; let r=46*s+16,g=52*s+18,b=130*s+50; if(m>.6){g+=75;r-=10;b-=30} return [r,g,b]},4,3);
T.leafBlue=mkTex(64,(u,v)=>{const n=fbm(u,v,8,51),sp=h2(u*64,v*64,7);let r=6+16*n,g=26+70*n,b=40+90*n;
  if(sp>.86){r=90+70*n;g=110+60*n;b=255} else if(sp>.78){g+=80} return [r,g,b]},2,2);
T.leafRed=mkTex(64,(u,v)=>{const n=fbm(u,v,8,55),m=fbm(u,v,16,57,3),sp=h2(u*64,v*64,9);let r=120+135*n,g=14+90*n*m,b=6+20*n;
  if(m>.64){r=40;g=120+60*n;b=30} if(sp>.93){r=255;g=190;b=60} return [r,g,b]},2,2);
T.autumn=mkTex(128,(u,v)=>{const n=fbm(u*2,v*.5,8,81),m=fbm(u,v,8,83,3);const k=Math.abs(Math.sin(n*14));
  if(m>.6)return [30+40*k,90+70*k,50]; return [130+125*k,18+70*k*m,10+30*m]},3,2);
T.wood=mkTex(64,(u,v)=>{const n=fbm(u*.3,v,8,61);const k=.5+.5*Math.sin(n*40);return [90+70*k,38+35*k,20+50*(1-k)]});
T.pageEdge=drawTex(32,32,(g,w,h)=>{g.fillStyle='#e8e8ff';g.fillRect(0,0,w,h);g.fillStyle='#9a9ae0';for(let y=1;y<h;y+=3)g.fillRect(0,y,w,1)});
T.page=drawTex(64,64,(g,w,h)=>{g.fillStyle='#eef0ff';g.fillRect(0,0,w,h);g.fillStyle='#9aa0d8';for(let y=8;y<h-4;y+=6)g.fillRect(6,y,w-12-(y*7%17),2)});
T.spines=drawTex(128,64,(g,w,h)=>{g.fillStyle='#200c06';g.fillRect(0,0,w,h);const cols=['#e02a1a','#1aa03a','#2a4aff','#d8a020','#a020c0','#e05a10'];
  for(let r=0;r<2;r++){let x=2;while(x<w-4){const bw=4+Math.floor(rnd()*6),bh=22+rnd()*6;g.fillStyle=cols[Math.floor(rnd()*cols.length)];
    g.fillRect(x,r*32+30-bh,bw,bh);g.fillStyle='rgba(255,230,140,.8)';g.fillRect(x+1,r*32+30-bh+4,bw-2,1);x+=bw+1}}});
const coverTex=col=>drawTex(64,64,(g,w,h)=>{g.fillStyle=col;g.fillRect(0,0,w,h);g.strokeStyle='#ffd24a';g.lineWidth=3;g.strokeRect(5,5,w-10,h-10);g.fillStyle='#ffd24a';star4(g,32,32,16,5)});
T.window=drawTex(32,48,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#fff0a0');gr.addColorStop(.5,'#ffb020');gr.addColorStop(1,'#ff5a10');
  g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle='#3a1000';g.lineWidth=2;for(let i=-h;i<w+h;i+=10){g.beginPath();g.moveTo(i,0);g.lineTo(i+h,h);g.stroke();
  g.beginPath();g.moveTo(i+h,0);g.lineTo(i,h);g.stroke()} g.lineWidth=4;g.strokeRect(0,0,w,h)});
T.gate=drawTex(48,64,(g,w,h)=>{g.fillStyle='#200';g.fillRect(0,0,w,h);const gr=g.createRadialGradient(24,40,2,24,40,40);gr.addColorStop(0,'#ffe080');gr.addColorStop(.5,'#ff4a10');gr.addColorStop(1,'#a00a00');
  g.fillStyle=gr;g.beginPath();g.moveTo(2,h);g.lineTo(2,24);g.quadraticCurveTo(24,-8,46,24);g.lineTo(46,h);g.fill();
  g.strokeStyle='#300400';g.lineWidth=2;for(let x=8;x<w;x+=8){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=8;y<h;y+=8){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}});
T.robe=drawTex(64,64,(g,w,h)=>{g.fillStyle='#0c0a3a';g.fillRect(0,0,w,h);g.fillStyle='#ffc832';for(let k=0;k<9;k++)star5(g,rnd()*w,rnd()*h,3+rnd()*4)},3,2);
T.carpet=drawTex(64,128,(g,w,h)=>{g.fillStyle='#3a0a8a';g.fillRect(0,0,w,h);g.strokeStyle='#ffc832';g.lineWidth=4;g.strokeRect(4,4,w-8,h-8);g.strokeStyle='#ff5a2a';g.lineWidth=2;g.strokeRect(10,10,w-20,h-20);
  g.fillStyle='#ffc832';for(let k=0;k<5;k++)star5(g,32,22+k*21,7);g.fillStyle='#6a9aff';for(let k=0;k<4;k++){star4(g,18,32+k*21,5);star4(g,46,32+k*21,5)}});
T.mush=drawTex(64,64,(g,w,h)=>{g.fillStyle='#8a14c8';g.fillRect(0,0,w,h);const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(255,90,220,.7)');gr.addColorStop(1,'rgba(30,0,120,.7)');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='#7af0ff';for(let k=0;k<14;k++){g.beginPath();g.arc(rnd()*w,rnd()*h*.8,2+rnd()*4,0,TAU);g.fill()}});
T.orb=drawTex(128,64,(g,w,h)=>{g.fillStyle='#1a22ff';g.fillRect(0,0,w,h);for(let k=0;k<60;k++){g.fillStyle=rnd()<.5?'rgba(0,0,40,.75)':'rgba(70,90,255,.8)';g.beginPath();g.ellipse(rnd()*w,rnd()*h,2+rnd()*6,2+rnd()*4,rnd()*3,0,TAU);g.fill()}
  g.fillStyle='#fff';for(let k=0;k<16;k++)star4(g,rnd()*w,rnd()*h,2+rnd()*4);
  [32,96].forEach(cx=>{g.fillStyle='#ff2a1a';g.beginPath();g.ellipse(cx-7,26,5,3.5,-.3,0,TAU);g.ellipse(cx+7,26,5,3.5,.3,0,TAU);g.fill();g.strokeStyle='#ff2a1a';g.lineWidth=3;g.beginPath();g.arc(cx,30,10,.25,Math.PI-.25);g.stroke()})});
T.mail=mkTex(64,(u,v)=>{const [d1,d2,id]=voro(u,v,10,44);const e=clamp((d2-d1)*4,0,1);return [30+190*e*(.5+.5*id),14+90*e*id,50+60*(1-e)]},2,2);
T.glow=drawTex(64,64,(g)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.25,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)});
T.star=drawTex(64,64,(g)=>{const gr=g.createRadialGradient(32,32,0,32,32,30);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);g.fillStyle='#fff';star4(g,32,32,31,3)});
T.flame=drawTex(64,96,(g)=>{for(let k=0;k<5;k++){const t=k/4,gr=g.createRadialGradient(32,70-t*20,0,32,70-t*20,26-t*14);
  gr.addColorStop(0,`rgba(255,255,255,${.5+.5*t})`);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;
  g.beginPath();g.moveTo(32,2+t*30);g.bezierCurveTo(60-t*14,50,54-t*12,94,32,94);g.bezierCurveTo(10+t*12,94,4+t*14,50,32,2+t*30);g.fill()}});
T.moon=drawTex(256,256,(g)=>{g.save();g.beginPath();g.arc(128,128,122,0,TAU);g.clip();
  const g2=g.createRadialGradient(100,92,10,128,128,126);g2.addColorStop(0,'#f6f8ff');g2.addColorStop(.7,'#a8b4ff');g2.addColorStop(1,'#5a66e8');g.fillStyle=g2;g.fillRect(0,0,256,256);
  for(let i=0;i<70;i++){const x=rnd()*256,y=rnd()*256,r=4+rnd()*30;g.fillStyle=`rgba(${30+rnd()*30},${30+rnd()*30},${140+rnd()*70},${.1+rnd()*.3})`;g.beginPath();g.ellipse(x,y,r,r*rr(.6,1),rnd()*3,0,TAU);g.fill()}
  for(let i=0;i<26;i++){const x=rnd()*256,y=rnd()*256,r=2+rnd()*7;g.strokeStyle='rgba(240,244,255,.5)';g.lineWidth=1;g.beginPath();g.arc(x,y,r,0,TAU);g.stroke();g.fillStyle='rgba(40,40,150,.3)';g.fill()}
  g.restore()});
const skullTex=crown=>drawTex(64,64,(g)=>{const gr=g.createRadialGradient(32,34,4,32,34,30);gr.addColorStop(0,'rgba(200,250,255,.9)');gr.addColorStop(1,'rgba(60,160,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);

  for(const o of colliders){if(P.y>=o.top-.06||P.y+PH<=o.bot)continue;
    if(o.t==='cyl'){const dx=P.x-o.x,dz=P.z-o.z,d=Math.hypot(dx,dz)||1e-4;if(d<o.R+PR){const f=(o.R+PR)/d;P.x=o.x+dx*f;P.z=o.z+dz*f}}
    else{const px=o.w/2+PR-Math.abs(P.x-o.x),pz=o.d/2+PR-Math.abs(P.z-o.z);if(px>0&&pz>0){if(px<pz)P.x+=px*Math.sign(P.x-o.x||1);else P.z+=pz*Math.sign(P.z-o.z||1)}}}
  const wasAir=!P.ground,vy0=P.vy;P.vy-=GRAV*dt;if(P.vy<-40)P.vy=-40;let ny=P.y+P.vy*dt;P.ground=null;
  for(const o of colliders){if(!overXZ(o,P.x,P.z,o.t==='cyl'?0:PR*.5))continue;
    if(P.vy<=0&&P.y>=o.top-.25&&ny<=o.top+.001){ny=o.top;
      if(o.bounce){P.vy=o.vb||BOUNCE;o.sq=1;P.pad=o;P.coyote=0;sfx.boing()}else{P.vy=0;P.ground=o}}
    else if(P.vy>0&&P.y+PH<=o.bot+.05&&ny+PH>o.bot){ny=o.bot-PH;P.vy=0}}
  P.y=ny;
  if(P.ground){if(wasAir&&vy0<-6){P.dip=Math.min(.35,-vy0*.02);sfx.land()}
    if(P.ground.cp!==undefined&&P.ground.cp>P.cp){P.cp=P.ground.cp;toast('Checkpoint!');sfx.chime()}}
  if(P.y<WATER-.5)respawn();
  for(const p of pickups){if(p.got)continue;if(Math.hypot(p.x-P.x,p.y-(P.y+1),p.z-P.z)<1.7){p.got=true;p.s.visible=p.gl.visible=false;got++;sfx.star();updHud()}}
  if(goal&&Math.hypot(P.x-goal.x,P.z-goal.z)<1.9&&Math.abs(P.y-goal.y)<1.5)levelClear();
}
function updHud(){$('stars').textContent='✦ '+got+'/'+pickups.length;$('lvl').textContent=(LI+1)+'/'+LEVELS.length}
let toastT;function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,2200)}
const fmt=t=>Math.floor(t/60)+':'+('0'+(t%60).toFixed(1)).slice(-4);
function showUI(play){const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
  $('hud').style.display=play?'block':'none';$('jump').style.display=play&&touch?'flex':'none';if(!play){$('stick').style.display='none';$('hint').style.display='none';stickId=lookId=null;inp.mx=inp.my=0;inp.jump=false}
  return touch}
function levelClear(){state='clear';sfx.win();showUI(false);totalT+=runT;const last=LI===LEVELS.length-1;
  let best=null;try{const k='moonrealm_best_'+LI;best=parseFloat(localStorage.getItem(k))||null;if(!best||runT<best){localStorage.setItem(k,runT);best=runT}
    unlocked=Math.max(unlocked,Math.min(LEVELS.length,LI+2));localStorage.setItem('moonrealm_unlocked',unlocked)}catch(e){unlocked=Math.max(unlocked,Math.min(LEVELS.length,LI+2))}
  $('cleartitle').innerHTML=last?'The realm<br>is yours':'The gate<br>opens';
  $('clearstats').textContent='Time '+fmt(runT)+'  ·  ✦ '+got+'/'+pickups.length;$('clearbest').textContent=best?'Best time '+fmt(best):'';
  $('next').textContent=last?'Begin anew':'Onward';$('clear').style.display='flex';try{document.exitPointerLock()}catch(e){}}
function startLevel(i){audioInit();buildLevel(i);state='play';runT=0;got=0;P.cp=0;place(checkpoints[0]);updHud();
  $('title').style.display='none';$('clear').style.display='none';const touch=showUI(true);$('hint').style.display='none';
  if(i===0&&touch){$('hint').style.display='block';setTimeout(()=>$('hint').style.display='none',6000)}
  toast((i+1)+'. '+LEVELS[i].n)}
function toTitle(){state='title';showUI(false);$('clear').style.display='none';$('title').style.display='flex';mkGrid();try{document.exitPointerLock()}catch(e){}}
function mkGrid(){const g=$('grid');g.innerHTML='';LEVELS.forEach((l,i)=>{const b=document.createElement('button');b.textContent=i+1;if(i>=unlocked)b.disabled=true;b.addEventListener('click',()=>startLevel(i));g.appendChild(b)});
  $('start').textContent=unlocked>1?'Continue':'Enter'}

/* ---------- input ---------- */
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){P.jbuf=.15;e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.code]=false});
const touchEl=$('touch');let stickId=null,lookId=null,sox=0,soy=0,lx=0,ly=0,mouseDown=false;
touchEl.addEventListener('pointerdown',e=>{if(state!=='play')return;
  if(e.pointerType==='mouse'){mouseDown=true;try{const r=touchEl.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(_){}return}
  try{touchEl.setPointerCapture(e.pointerId)}catch(_){}
  if(e.clientX<innerWidth*.5&&stickId===null){stickId=e.pointerId;sox=e.clientX;soy=e.clientY;const st=$('stick');st.style.display='block';st.style.left=sox+'px';st.style.top=soy+'px';$('knob').style.transform='';$('hint').style.display='none'}
  else if(lookId===null){lookId=e.pointerId;lx=e.clientX;ly=e.clientY}});
touchEl.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){if(document.pointerLockElement===touchEl||mouseDown){P.yaw-=e.movementX*.0028;P.pitch=clamp(P.pitch-e.movementY*.0028,-1.3,1.3)}return}
  if(e.pointerId===stickId){let dx=e.clientX-sox,dy=e.clientY-soy;const d=Math.hypot(dx,dy),R=52;if(d>R){dx*=R/d;dy*=R/d}
    inp.mx=dx/R;inp.my=dy/R;$('knob').style.transform=`translate(${dx}px,${dy}px)`}
  else if(e.pointerId===lookId){P.yaw-=(e.clientX-lx)*.0065;P.pitch=clamp(P.pitch-(e.clientY-ly)*.0055,-1.3,1.3);lx=e.clientX;ly=e.clientY}});
const pend=e=>{if(e.pointerType==='mouse'){mouseDown=false;return}
  if(e.pointerId===stickId){stickId=null;inp.mx=inp.my=0;$('stick').style.display='none'}if(e.pointerId===lookId)lookId=null};
touchEl.addEventListener('pointerup',pend);touchEl.addEventListener('pointercancel',pend);
const jb=$('jump');
jb.addEventListener('pointerdown',e=>{e.preventDefault();inp.jump=true;P.jbuf=.18;jb.classList.add('on');try{jb.setPointerCapture(e.pointerId)}catch(_){}});
const jend=()=>{inp.jump=false;jb.classList.remove('on')};jb.addEventListener('pointerup',jend);jb.addEventListener('pointercancel',jend);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
$('start').addEventListener('click',()=>{totalT=0;startLevel(Math.min(unlocked,LEVELS.length)-1)});
$('next').addEventListener('click',()=>startLevel(LI===LEVELS.length-1?0:LI+1));
$('menu').addEventListener('click',toTitle);


/* ---------- audio ---------- */
let AC=null,master=null,muted=false;const sfx={jump(){},land(){},star(){},splash(){},win(){},chime(){},boing(){}};
function audioInit(){if(AC){try{AC.resume()}catch(e){}return}
  try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();master=AC.createGain();master.gain.value=muted?0:.6;master.connect(AC.destination);
    const delay=AC.createDelay(1);delay.delayTime.value=.36;const fb=AC.createGain();fb.gain.value=.45;delay.connect(fb);fb.connect(delay);delay.connect(master);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.Q.value=4;const dg=AC.createGain();dg.gain.value=.11;lp.connect(dg);dg.connect(master);
    [55,82.4,110.6,164.2].forEach((f,i)=>{const o=AC.createOscillator();o.type=i%2?'triangle':'sawtooth';o.frequency.value=f;o.detune.value=i*5-6;o.connect(lp);o.start()});
    const lfo=AC.createOscillator();lfo.frequency.value=.07;const lg=AC.createGain();lg.gain.value=180;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
    const nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const tone=(f,d,type='sine',vol=.2,wet=true,slide=0,when=0)=>{const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
      if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);
      o.connect(g);g.connect(master);if(wet)g.connect(delay);o.start(t);o.stop(t+d+.05)};
    const noise=(d,vol,freq)=>{const t=AC.currentTime,s=AC.createBufferSource();s.buffer=nb;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;const g=AC.createGain();
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(master);g.connect(delay);s.start(t);s.stop(t+d+.05)};
    const scale=[220,261.6,293.7,329.6,392,440,523.3,587.3,659.3,784,880];
    (function bell(){if(AC.state==='running'&&state!=='title'){const f=scale[Math.floor(Math.random()*scale.length)]*(Math.random()<.3?2:1);tone(f,2.2,'sine',.07);tone(f*2.01,1.2,'triangle',.02)}
      setTimeout(bell,500+Math.random()*1400)})();
    sfx.jump=()=>tone(280,.16,'triangle',.14,false,2.1);
    sfx.land=()=>tone(110,.14,'sine',.2,false,.45);
    sfx.boing=()=>{tone(150,.45,'triangle',.2,true,4.5);tone(600,.5,'sine',.08,true,2,.04)};
    sfx.star=()=>{tone(880,.5,'sine',.14);tone(1318.5,.7,'sine',.12,true,0,.09);tone(1760,.9,'sine',.09,true,0,.18)};
    sfx.chime=()=>{[440,554.4,659.3].forEach((f,i)=>tone(f,1.2,'triangle',.1,true,0,i*.12))};
    sfx.splash=()=>{noise(.8,.3,900);tone(500,.7,'sawtooth',.07,true,.2)};
    sfx.win=()=>{[440,554.4,659.3,880,1108.7,1318.5].forEach((f,i)=>tone(f,1.8,'triangle',.12,true,0,i*.14))};
  }catch(e){}}
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'×':'♪';if(master)master.gain.value=muted?0:.6;audioInit()});
document.addEventListener('visibilitychange',()=>{if(AC){try{document.hidden?AC.suspend():AC.resume()}catch(e){}}});

/* ---------- test bot (not used in play) ---------- */
function nearest(c,x,z,inset){if(c.t==='cyl'){const dx=x-c.x,dz=z-c.z,d=Math.hypot(dx,dz)||1e-4,r=Math.max(0,c.R-inset),f=Math.min(1,r/d);return [c.x+dx*f,c.z+dz*f]}
  return [clamp(x,c.x-Math.max(0,c.w/2-inset),c.x+Math.max(0,c.w/2-inset)),clamp(z,c.z-Math.max(0,c.d/2-inset),c.z+Math.max(0,c.d/2-inset))]}
let botI=0;
function botStep(){const g=P.ground;if(g){const i=route.indexOf(g);if(i>=0)botI=i;P.pad=null}else if(P.pad){const i=route.indexOf(P.pad);if(i>botI)botI=i}
  inp.jump=false;inp.mx=0;inp.my=-1;
  if(botI>=route.length-1){P.yaw=Math.atan2(-(goal.x-P.x),-(goal.z-P.z));return}
  const t0=route[botI+1];let t=t0;
  if(t0.move&&t0.move.ax!=='y'&&t0.move.ax!=='s'){const m=t0.move,lead=g?.5:Math.max(0,(P.vy+Math.sqrt(Math.max(0,P.vy*P.vy+2*GRAV*(P.y-t0.top))))/GRAV),a=mvOff(m,time+lead),b0=mvOff(m,time);
    t=Object.assign({},t0);t.x+=a[0]-b0[0];t.z+=a[2]-b0[2]}
  const a=nearest(t,P.x,P.z,.6),dx=a[0]-P.x,dz=a[1]-P.z,dl=Math.hypot(dx,dz)||1e-4;P.yaw=Math.atan2(-dx,-dz);
  if(g){const e=nearest(t,P.x,P.z,0),de=Math.hypot(e[0]-P.x,e[1]-P.z),dy=t0.top-P.y,range=dy>1.35?-1:dy>.35?3.5:4;
    if(!overXZ(g,P.x+dx/dl*.3,P.z+dz/dl*.3,-.05)){if(de<=range)inp.jump=true;else inp.my=0}}
  else if(dl<.25&&P.y>t0.top-.3)inp.my=0}
function botRun(i,maxT=240){startLevel(i);falls=0;botI=0;const dt=1/60;let t=0;while(t<maxT&&state==='play'){botStep();time+=dt;runT+=dt;physics(dt);t+=dt}
  inp.mx=inp.my=0;inp.jump=false;return {level:i+1,done:state==='clear',t:+t.toFixed(1),falls,at:botI,of:route.length-1}}


/* ---------- loop ---------- */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  if(state==='play'){runT+=dt;const n=Math.ceil(dt/.017);for(let i=0;i<n;i++)physics(dt/n);
    $('barfill').style.width=clamp((1.5-P.z)/(1.5-goal.z),0,1)*100+'%'}
  const sp=Math.hypot(P.vx,P.vz);if(P.ground&&state==='play')P.bob+=sp*dt*1.5;P.dip*=Math.pow(.001,dt);
  const bob=Math.sin(P.bob*2)*.06*Math.min(1,sp/SPEED);
  if(state==='title'){camera.position.set(Math.sin(time*.12)*1.6,2.2+Math.sin(time*.3)*.2,3.4);camera.rotation.set(.12,Math.sin(time*.12)*.5,0)}
  else{camera.position.set(P.x,P.y+EYE+bob-P.dip,P.z);camera.rotation.set(P.pitch,P.yaw,Math.sin(P.bob)*.012*Math.min(1,sp/SPEED))}
  skyG.position.copy(camera.position);skyMat.uniforms.t.value=time;swirlMat.uniforms.t.value=time*1.6;
  T.water.offset.set(time*.01,time*.022);T.caus.offset.set(-time*.018,time*.012);T.fall.offset.y=time*.9;sparkMat.opacity=.7+.3*Math.sin(time*3);
  for(const L of [flames,gflames])for(const f of L){const k=.85+.25*Math.sin(time*13+f.ph)+.12*Math.sin(time*29+f.ph*2);f.f.scale.set(1.1*f.s*(1.05-.2*(k-.85)),1.9*f.s*k,1);f.gl.material.opacity=.35+.2*k}
  fireL.intensity=1+.3*Math.sin(time*13)+.15*Math.sin(time*29);
  for(const b of bats){const a=b.ph+time*b.sp;b.g.position.set(b.cx+Math.cos(a)*b.R,b.cy+Math.sin(a*2.3+b.ph)*1.2,b.cz+Math.sin(a)*b.R);
    b.g.rotation.y=-a+(b.sp>0?Math.PI:0);const w=Math.sin(time*b.fl+b.ph)*.8;b.wl.rotation.z=w;b.wr.rotation.z=-w}
  for(const b of flyBooks){const a=b.ph+time*b.sp;b.g.position.set(b.cx+Math.cos(a)*b.R,b.cy+Math.sin(a*1.7)*1.5,b.cz+Math.sin(a)*b.R);
    b.g.rotation.set(b.tilt,-a,Math.sin(a*2)*.3);const w=.35+.3*Math.sin(time*6+b.ph);for(const h of b.halves)h[0].rotation.z=h[1]*w}
  for(const s of bobbers)s.o.position.y=s.y+Math.sin(time*1.4+s.ph)*.35;
  for(const p of pickups){if(p.got)continue;const k=1.4+.3*Math.sin(time*4+p.ph);p.s.scale.set(k,k,1);p.s.position.y=p.gl.position.y=p.y+Math.sin(time*2+p.ph)*.2;p.s.material.rotation=time*.8}
  for(const s of spinners){s.material.rotation=time*1.2;const k=2.8+.6*Math.sin(time*5);s.scale.set(k,k,1)}
  for(const p of pads){p.sq*=Math.pow(.002,dt);p.mesh.scale.y=1-.5*p.sq;p.mesh.position.y=p.top-.25*p.sq;if(p.vb)p.mesh.rotation.y=Math.sin(time*1.5+p.x)*.25}
  wiz.rotation.y=Math.atan2(camera.position.x-wiz.position.x,camera.position.z-wiz.position.z);wiz.position.y=Math.sin(time*2)*.05;
  renderer.render(scene,camera);
}
buildLevel(0);mkGrid();
window.__g={P,startLevel,botRun,goal:()=>goal,get state(){return state},LEVELS};
requestAnimationFrame(frame);
</script>
